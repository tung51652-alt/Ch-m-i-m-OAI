name: Deploy leaderboard to GitHub Pages

on:
  push:
    branches: [main]
  # Commits pushed by the grader use GITHUB_TOKEN and do not trigger "push",
  # so redeploy whenever a grading run finishes.
  workflow_run:
    workflows: [Grade submission]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt ground truth (for submission requirements)
        env:
          GRADER_DATA_KEY: ${{ secrets.GRADER_DATA_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/data"
          if [[ -n "${GRADER_DATA_KEY}" && -f secure/ground_truth.tar.gz.enc ]]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:GRADER_DATA_KEY \
              -in secure/ground_truth.tar.gz.enc | tar xzf - -C "${RUNNER_TEMP}/data"
          fi
          echo "GRADER_DATA_ROOT=${RUNNER_TEMP}/data" >> "${GITHUB_ENV}"

      - name: Build site
        env:
          GRADER_PASSWORD: ${{ secrets.GRADER_PASSWORD }}
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: python scripts/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
