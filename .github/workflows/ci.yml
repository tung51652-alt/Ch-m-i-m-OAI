name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: Browser grader tests
        run: node --test test_grader.js

      - name: Build site
        run: python scripts/build_site.py --out "${RUNNER_TEMP}/_site"
