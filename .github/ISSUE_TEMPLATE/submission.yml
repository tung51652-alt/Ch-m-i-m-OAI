name: Nộp bài chấm điểm
description: Nộp file dự đoán (.csv, .jsonl hoặc .zip) để hệ thống tự chấm và cập nhật bảng xếp hạng.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Mỗi issue là **một lần nộp**. Sau khoảng 1 phút, bot sẽ comment điểm vào issue này và tự đóng issue.

        Schema: DeepWeeds `image_id,label` · Spam Review `id,label` · ViLexNorm `id,normalized`.
        DeepWeeds/Spam Review dùng Public hoặc Private Test; ViLexNorm chỉ dùng Test Set.
        Ghost: Public = Leaderboard A; Private = Leaderboard B (380 mẫu/tập). Nộp `answers.jsonl` hoặc CSV `id,boundary_char_index`.
        Ghost dùng Boundary Score 0–100; chỉ số là số nguyên trong [0, len(text)]. ZIP Ghost chứa đúng một `answers.jsonl` hoặc CSV.
        File ZIP cho các bài cũ phải chứa đúng một file `submission.csv` hoặc `output.csv`.
  - type: dropdown
    id: team
    attributes:
      label: Đội
      options:
        - "Kiên"
        - "Tùng"
        - "Thanh"
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Tác vụ
      options:
        - "Tác vụ 1 — Computer Vision: DeepWeeds"
        - "Tác vụ 2 — NLP: Vietnamese Spam Review Detection"
        - "Tác vụ 3 — NLP: ViLexNorm"
        - "Tác vụ 4 — NLP: Ghost of the Machine"
    validations:
      required: true
  - type: dropdown
    id: split
    attributes:
      label: Tập đánh giá
      options:
        - "Public Test"
        - "Private Test"
        - "Test Set (ViLexNorm)"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File submission
      description: Kéo thả file .csv, .jsonl hoặc .zip vào ô này và chờ GitHub upload xong (hiện ra một đường link) rồi mới bấm Submit. Hoặc dán link raw của một Gist (gist.githubusercontent.com/.../raw/.../output.csv).
      placeholder: Kéo thả file vào đây
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Ghi chú
      description: Không bắt buộc, ví dụ mô hình/ý tưởng đã dùng.
    validations:
      required: false
