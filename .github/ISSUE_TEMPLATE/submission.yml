name: Nộp bài chấm điểm
description: Nộp file dự đoán (.csv hoặc .zip) để hệ thống tự chấm và cập nhật bảng xếp hạng.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Mỗi issue là **một lần nộp**. Sau khoảng 1 phút, bot sẽ comment điểm vào issue này và tự đóng issue.

        Schema: DeepWeeds `image_id,label` · Spam Review `id,label`.
        File ZIP phải chứa đúng một file `submission.csv` hoặc `output.csv`.
  - type: dropdown
    id: team
    attributes:
      label: Đội
      options:
        - "Kiên"
        - "Tùng"
        - "Thanh"
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Tác vụ
      options:
        - "Tác vụ 1 — Computer Vision: DeepWeeds"
        - "Tác vụ 2 — NLP: Vietnamese Spam Review Detection"
    validations:
      required: true
  - type: dropdown
    id: split
    attributes:
      label: Tập đánh giá
      options:
        - "Public Test"
        - "Private Test"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File submission
      description: Kéo thả file .csv hoặc .zip vào ô này và chờ GitHub upload xong (hiện ra một đường link) rồi mới bấm Submit. Hoặc dán link raw của một Gist (gist.githubusercontent.com/.../raw/.../output.csv).
      placeholder: Kéo thả file vào đây
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Ghi chú
      description: Không bắt buộc, ví dụ mô hình/ý tưởng đã dùng.
    validations:
      required: false
